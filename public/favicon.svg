<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Henry Quispe logo">
    <defs>
        <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%" stop-color="#4f46e5"/>
            <stop offset="100%" stop-color="#4338ca"/>
        </linearGradient>
        <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
        </filter>
    </defs>

    <!-- Fondo con esquinas redondeadas -->
    <rect width="64" height="64" rx="12" fill="url(#g)" filter="url(#s)" />

    <!-- Acente circular pequeño -->
    <circle cx="46" cy="18" r="6" fill="#0ea5a4" opacity="0.95" />

    <!-- Monograma -->
    <text x="32" y="40" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">HQ</text>
</svg>
